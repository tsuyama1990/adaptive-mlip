[project]
name = "pyacemaker"
version = "0.1.0"
description = "Adaptive machine learning interatomic potentials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mypy>=1.19.1",
    "ruff>=0.15.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ase>=3.27.0",
    "numpy>=2.4.2",
    "lammps>=2025.7.22.2.0",
    "phonopy>=2.20.0",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",
    "mace-torch>=0.3.15",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
]
authors = [
    { name = "Tomoyuki Tsuyama", email = "tomoyuki.tsuyaman@gmail.com" }
]

[project.scripts]
pyacemaker = "pyacemaker.main:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-pyyaml>=6.0.12.20250915",
    "marimo>=0.20.4",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "N", "UP", "YTT", "ANN", "ASYNC", "S", "BLE",
    "B", "A", "C4", "DTZ", "T10", "EM", "ICN", "PIE", "T20", "PT", "RET",
    "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY", "RUF"
]

ignore = [
    "ANN101", "ANN002", "ANN003", "ANN001", "ANN401", "ARG001", "ARG005",
    "PLR2004", "E501", "TRY003", "D", "ANN201", "N806", "PLC0415", "BLE001",
    "PT019", "RUF003", "ARG002", "RUF043", "RUF059", "PLR0913", "ANN202"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.ruff.lint.mccabe]
max-complexity = 10  # Exceeding this prompts function splitting (prevent AI long functions)

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true  # Arguments starting with _ do not require type hints

[tool.pytest.ini_options]
addopts = "--cov=dev_src --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
